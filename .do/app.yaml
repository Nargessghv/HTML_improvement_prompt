# Digital Ocean App Platform Configuration
# PowerPoint Slide Creator - Production Deployment

name: ekona-slide-creator
region: nyc

services:
  # Frontend Service - Next.js
  - name: frontend
    source_dir: /
    dockerfile_path: Dockerfile.frontend
    github:
      repo: ekona-ai/slides-creator
      branch: main
    http_port: 3000
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: "${backend.PRIVATE_URL}"
      - key: NEXT_PUBLIC_APP_URL
        value: "${APP_URL}"
      - key: NEXT_PUBLIC_APP_NAME
        value: "ekona Slide Creator"
      - key: NEXT_PUBLIC_COMPANY_NAME
        value: "ekona"
      - key: NEXTAUTH_SECRET
        value: "${NEXTAUTH_SECRET}"
      - key: JWT_SECRET
        value: "${JWT_SECRET}"
      - key: NEXT_PUBLIC_STORAGE_BUCKET
        value: "presentations-prod"
      - key: NEXT_PUBLIC_ENABLE_REALTIME
        value: "true"
      - key: NEXT_PUBLIC_ENABLE_AI_CHAT
        value: "true"
      - key: NEXT_PUBLIC_ENABLE_EXPORT
        value: "true"
    health_check:
      http_path: /health

  # Backend Service - Python FastAPI (Internal)
  - name: backend
    source_dir: /
    dockerfile_path: Dockerfile.backend
    github:
      repo: ekona-ai/slides-creator
      branch: main
    instance_count: 1
    instance_size_slug: basic-s  # Larger instance for AI processing
    internal_ports:
      - 8000
    envs:
      - key: PYTHONPATH
        value: "/app"
      - key: PYTHONUNBUFFERED
        value: "1"
    health_check:
      http_path: /health

# Global environment variables
envs:
  - key: APP_URL
    value: "econtent.ekona.ai"  # Update after deployment
  - key: CORS_ORIGINS
    value: "econtent.ekona.ai"  # Update after deployment

# Alerts can be configured in the Digital Ocean dashboard after deployment